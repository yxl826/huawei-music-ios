name: build-ios-ipa

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unsigned-ipa:
    name: 编译未签名 ipa
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 切换 Xcode（玻璃效果需要 26 及以上）
        run: |
          # macos-15 默认是 Xcode 16.4（Swift 6.1），编不出 Liquid Glass。
          # 显式切到已安装的 Xcode 26.x，让 glassEffect 那条分支真的进二进制；
          # 找不到就继续用默认版本，代码里的 #if compiler 会自动退回材质近似。
          PICKED=""
          for v in 26.6 26.5 26.4 26.3 26.2 26.1 26.0.1 26.0; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then PICKED="/Applications/Xcode_${v}.app"; break; fi
          done
          if [ -n "$PICKED" ]; then
            sudo xcode-select -s "$PICKED"
            echo "使用 $PICKED"
          else
            echo "::warning::没有找到 Xcode 26，玻璃将退回材质近似"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

          # 让构建结果可见：跑完在 check annotation 里能读到用的是哪套工具链。
          echo "::notice::Xcode $(xcodebuild -version | head -1) / iOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: 显示工具链版本
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        run: xcodegen generate

      - name: 编译（不开签名）
        id: build
        run: |
          set +e
          xcodebuild \
            -project MusicHall.xcodeproj \
            -scheme MusicHall \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # 把每一条编译器报错转成 annotation：这样即使没有仓库权限也能在
            # checks/annotations 接口里读到「文件:行: 具体错误」。
            grep -aE "(fatal error|error): " build.log | head -40 | while IFS= read -r line; do
              printf '::error::%s\n' "${line//$'\r'/}"
            done
            echo "===== 日志尾部 60 行 ====="
            tail -n 60 build.log
          fi
          exit "$status"

      - name: 保存编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 打包成 ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/MusicHall.app"
          test -d "$APP_PATH"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP_PATH" out/Payload/
          cd out
          zip -qry ../MusicHall-unsigned.ipa Payload
          cd ..
          ls -lh MusicHall-unsigned.ipa

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MusicHall-unsigned-ipa
          path: MusicHall-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 打 tag 时附到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MusicHall-unsigned.ipa
          body: |
            未签名 ipa，需要用 Sideloadly / AltStore / TrollStore 之类自行签名后安装。

            非官方客户端，与华为及其关联公司无隶属或合作关系，不提供任何音源，只播放你自己账号里已有权益的内容。
